[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdos-toolkit"
version = "1.0.0"
description = "Gaussian-broadened PDOS post-processing and plotting for CP2K"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Diego García-López" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
pdos-process = "pdos_toolkit.pdos_processor:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
